[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai_ml_sdk_model_converter"
description = "ML SDK Model Converter"
readme = "README.md"
dynamic = ["version"]
license = { text = "Apache-2.0 WITH LLVM-exception" }
authors = [
    { name = "Arm Limited" }
]
requires-python = ">=3.8"

[project.scripts]
model_converter = "model_converter.cli:main"
model-converter = "model_converter.cli:main"

[tool.setuptools]
package-dir = { "" = "pip_package" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["pip_package"]

[tool.setuptools.package-data]
model_converter = ["binaries/**"]

[tool.setuptools_scm]
fallback_version = "0.10.0"

[tool.black]
target-version = ['py310']

[tool.pytest.ini_options]
